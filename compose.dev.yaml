# Créditos: oEnzoRibas
# LOCAL ONLY. Never reuse this stack/volume/credentials on the VPS.
name: podiss-dev
services:
  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: podiss_dev
      MARIADB_USER: podiss_dev
      MARIADB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in .env.dev}
      MARIADB_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD:?Set DEV_DB_ROOT_PASSWORD in .env.dev}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Deliberately no host port: the database is reachable only inside this stack.
  migrate:
    image: redgate/flyway:10.20.1
    environment:
      FLYWAY_URL: jdbc:mariadb://db:3306/podiss_dev
      FLYWAY_USER: podiss_dev
      FLYWAY_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in .env.dev}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_FAIL_ON_MISSING_LOCATIONS: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./src/main/resources/db/fresh-migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    command: migrate
    restart: "no"
  app:
    image: podiss-backend:dev
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      DB_URL: jdbc:mariadb://db:3306/podiss_dev
      DB_USERNAME: podiss_dev
      DB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in .env.dev}
      JWT_SECRET: ${DEV_JWT_SECRET:?Set a Base64-encoded 64-byte secret in .env.dev}
      CORS_ALLOWED_ORIGINS: ${DEV_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_USERNAME: dev_admin
      ADMIN_EMAIL: dev-admin@example.com
      ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:?Set a local admin password of at least 12 characters}
      HIKARI_MAX_POOL_SIZE: "5"
      HIKARI_MIN_IDLE: "1"
      YOUTUBE_API_KEY: ""
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  database:
