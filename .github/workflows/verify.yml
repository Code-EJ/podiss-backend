# Créditos: oEnzoRibas
name: Verify backend
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: H2 contracts and disposable MariaDB integration tests
        run: >-
          bash mvnw -B -ntp clean verify
          -Dapi.version=1.44
          -Dspring.profiles.active=ci
          -Dspring.flyway.enabled=false
          '-Dspring.datasource.url=jdbc:h2:mem:ci;MODE=MariaDB;DB_CLOSE_DELAY=-1'
          -Dspring.datasource.driver-class-name=org.h2.Driver
          -Dspring.datasource.username=sa
          -Dspring.datasource.password=
          -Dspring.jpa.hibernate.ddl-auto=create-drop
          -Dapp.cors.allowed-origins=http://localhost:5173
      - name: Build Java 21 container (no publishing or deploy)
        run: docker build -t podiss-backend:ci .
