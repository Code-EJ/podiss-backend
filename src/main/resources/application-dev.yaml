# application-dev.yml
server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    
    hikari:
      max-lifetime: ${HIKARI_MAX_LIFETIME}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}